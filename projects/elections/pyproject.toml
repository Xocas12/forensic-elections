[project]
name = "forensic-elections"
version = "0.1.0"
description = "Russian federal elections (2011 Duma, 2018 presidential), precinct level: calibrate digit and bunching methods against published falsification signatures."
requires-python = ">=3.12"
dependencies = [
    "forensics-core",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elections"]

[tool.uv.sources]
forensics-core = { workspace = true }
