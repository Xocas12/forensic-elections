name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  registries-valid:
    # Nothing enters a pipeline without a SOURCES.yaml entry, so the registries must parse and
    # satisfy their own validators on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --all-packages
      - run: make validate-sources

  no-data-committed:
    # HARD RULE: raw data never enters git. Reproducibility comes from `make data`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: nothing under data/raw, data/interim or data/processed
        run: |
          set -e
          bad=$(git ls-files | grep -E 'projects/[^/]+/data/(raw|interim|processed)/' | grep -v '\.gitkeep$' || true)
          if [ -n "$bad" ]; then echo "ERROR: committed data:"; echo "$bad"; exit 1; fi
          echo "no data committed"

  no-analysis-before-its-phase:
    # CONTRACT rule 4: every analysis module is still a stub. A passing suite would not catch
    # this, because an implemented analysis module passes its tests perfectly well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no analysis module has been implemented
        run: |
          set -e
          found=0
          for f in $(find projects -path '*/analysis/*.py' -not -name '__init__.py' 2>/dev/null); do
            if ! grep -q "NotImplementedError" "$f"; then
              echo "ERROR: $f contains no NotImplementedError; analysis has been implemented"
              found=1
            fi
          done
          exit $found

  submodule-parity:
    # The two project repositories share one method library through a submodule. Nothing else
    # stops those pointers drifting apart, and if they do, the two halves of the programme run
    # different method code and their results stop being comparable, silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: both project repositories pin the same forensics_core commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mine=$(git ls-tree HEAD packages/forensics_core | awk '{print $3}')
          theirs=$(gh api repos/${{ github.repository_owner }}/forensic-economy/contents/packages/forensics_core --jq .sha 2>/dev/null || echo "")
          echo "this repo:  $mine"
          echo "forensic-economy: $theirs"
          if [ -z "$theirs" ]; then
            echo "could not read the sibling pointer; not failing the build on an API hiccup"
            exit 0
          fi
          if [ "$mine" != "$theirs" ]; then
            echo "ERROR: the two project repositories pin DIFFERENT forensics_core commits."
            echo "They would run different method code. Bump both with scripts/bump_core.sh."
            exit 1
          fi
          echo "pointers agree"
